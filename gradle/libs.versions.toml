# Versions for every module and for build-logic. Bump through Renovate or a reviewed PR.
[versions]
kotlin = "2.4.21"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
serialization = "1.13.0"
# Must match the SQLDelight runtime pyrlyn.kit:db-sqldelight is built against.
sqldelight = "2.4.1"
coroutines = "1.11.0"
# Protobuf messages and service interfaces for every target (spec §17 D10).
wire = "7.2.2"

[libraries]
# build-logic puts these Gradle plugins on the classpath of every module.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
sqldelight-gradle-plugin = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "sqldelight" }
wire-gradle-plugin = { module = "com.squareup.wire:wire-gradle-plugin", version.ref = "wire" }

kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }

[plugins]
# build-logic formats itself with the same ktlint as the modules.
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
