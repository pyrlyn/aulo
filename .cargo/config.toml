# Windows: rust-lld ships with rustup (lib/rustlib/<host>/bin), so no extra install. It replaces
# link.exe; the MSVC libraries are still found through the VS environment. windows-gnu stays on
# mingw ld.
#
# Static CRT (+crt-static) on windows-msvc: sherpa-onnx-sys links its prebuilt
# `win-*-static-MT-Release` archive, built with /MT (static CRT, libucrt/libcmt), while Rust and
# cc-built C code (aws-lc-sys) default to /MD (dynamic CRT, __imp_ imports). link.exe papers over
# that mismatch by resolving the __imp_ symbols to the static CRT (LNK4217 warnings); rust-lld does
# not and fails with "undefined symbol: __declspec(dllimport) qsort_s/_wassert/...". Building the
# whole program with the static CRT matches the sherpa-onnx archive. Note: a RUSTFLAGS environment
# variable replaces these rustflags; keep +crt-static in it when setting RUSTFLAGS on Windows.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# whisper-rs-sys forwards every CMAKE_* variable to whisper.cpp's CMake build, which otherwise
# compiles with /MD (its cmake_minimum_required predates CMP0091, so the static-CRT choice the
# cmake crate makes for +crt-static is ignored) and rust-lld rejects the /MT sherpa-onnx archive
# next to it (/failifmismatch RuntimeLibrary). Only MSVC reads these; other targets ignore them.
[env]
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
