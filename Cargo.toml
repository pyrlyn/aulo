[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/aulo"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later OR LicenseRef-aulo-Royalty-Free"
repository = "https://github.com/pyrlyn/aulo"
publish = false

# One version per dependency for the whole workspace; members opt in with
# `dep.workspace = true` and add features locally.
[workspace.dependencies]
# error context in the binaries only
anyhow = "1.0.104"
# CLI parsing for `aulo` and `aulod`
clap = { version = "4.6.7", features = ["derive"] }
# typed SQLite access in aulo-store (no raw SQL)
diesel = { version = "2.3.13", default-features = false }
# embedded schema migrations
diesel_migrations = "2.3.2"
# bundled SQLite so the daemon never depends on a system libsqlite3; range matches diesel 2.3.13
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
# protobuf messages for the gRPC API; owned by aulo-proto
prost = "0.14.4"
# well-known protobuf types (Timestamp) used by the generated code
prost-types = "0.14.4"
# gRPC server and client runtime; owned by aulo-proto
tonic = "0.14.6"
# grpc.health.v1 service; owned by aulo-server
tonic-health = "0.14.6"
# prost codec for tonic
tonic-prost = "0.14.6"
# build-time code generation from proto/aulo/v1
tonic-prost-build = "0.14.6"
# gRPC server reflection for tooling (grpcurl, buf curl); owned by aulo-server
tonic-reflection = "0.14.6"
# TLS for the TCP listener and the pinned-fingerprint client verifier; aws-lc-rs, the provider reqwest already builds
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
# self-signed certificate for the TCP listener, generated on first start
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
# TLS stream under the pinned gRPC client in the aulo-server tests
tokio-rustls = { version = "0.26.6", default-features = false }
# HTTP/2 client IO adapter (TokioIo) for the gRPC client in tests
hyper-util = "0.1.21"
# layered config with per-key provenance
figment = "0.10.19"
# JSON Schema for config files
schemars = "1.2.2"
# OTLP trace export, only built with the aulo-telemetry `otlp` feature
opentelemetry = "0.33.0"
# OTLP span exporter over HTTP, only built with the aulo-telemetry `otlp` feature
opentelemetry-otlp = { version = "0.33.0", default-features = false }
# tracer provider and batch span processor, only built with the aulo-telemetry `otlp` feature
opentelemetry_sdk = "0.33.0"
# Objective-C runtime (Retained, downcasts) for the macOS system voices in aulo-speech-system
objc2 = "0.6.5"
# AVSpeechSynthesizer and AVAudioPCMBuffer bindings; members pick the framework features they use
objc2-avf-audio = { version = "0.3.2", default-features = false }
# NSString, NSArray and NSNumber for the AVFoundation calls; members pick features
objc2-foundation = { version = "0.3.2", default-features = false }
# SFSpeechRecognizer bindings for on-device macOS speech recognition; SpeechAnalyzer is Swift-only
objc2-speech = { version = "0.3.2", default-features = false }
# Objective-C blocks for AVSpeechSynthesizer's buffer callback
block2 = "0.6.2"
# WinRT SpeechSynthesizer for the Windows system voices in aulo-speech-system; members pick the namespaces they use
windows = { version = "0.62.2", default-features = false }
# microphone capture in aulo-audio (CoreAudio, WASAPI, ALSA); Linux builds need libasound2-dev
cpal = "0.18.2"
# fixed-size lock-free SPSC rings between platform audio callbacks and engine polls (spec §5.3)
ringbuf = "0.5.2"
# benchmarks of the deterministic parts of the speech harness (WER, resampling, measurement)
divan = "0.1.21"
# snapshot tests (golden speech text per language)
insta = "1.49.0"
# markdown to plain text for the speakable-text normalizer
pulldown-cmark = { version = "0.13.4", default-features = false }
# secret patterns for the log redaction layer
regex = "1.13.1"
# HTTPS client for model downloads (aulo-models) and cloud speech (aulo-speech-cloud); rustls, no system OpenSSL
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# base64 audio inside the JSON messages of the ElevenLabs streaming speech socket
base64 = "0.23.1"
# split a WebSocket into read and write halves, so a slow audio consumer never stalls the text we send
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# WebSocket client (rustls, platform trust roots) for the ElevenLabs stream-input speech API; approved in spec D4
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# WAV encoding of the utterance sent to a transcription endpoint
hound = "3.5.1"
# local speech engines (Parakeet STT, Kokoro TTS); owned by aulo-speech-sherpa. Exact pin: sherpa-onnx-sys pins
# the same version and its build script downloads that release's native lib (spike T0.5, R2/R7)
sherpa-onnx = "=1.13.8"
# zero-I/O server-sent-events parser for streaming transcription replies
sse-core = { version = "0.2.3", default-features = false, features = ["std"] }
# serialization of config, events and stored rows
serde = { version = "1.0.229", features = ["derive"] }
# plugin manifest versions (semver.org precedence and validation)
semver = { version = "1.0.28", features = ["serde"] }
# JSON for schemas, MCP and stored payloads
serde_json = "1.0.151"
# temporary dirs in tests
tempfile = "3.27.0"
# SHA-256 of downloaded model files, hashed while streaming
sha2 = "0.11.0"
# typed errors in library crates
thiserror = "2.0.21"
# async runtime for the daemon
tokio = "1.53.2"
# listener streams (UnixListenerStream, TcpListenerStream) for tonic's serve_with_incoming
tokio-stream = "0.1.19"
# CancellationToken fans one shutdown signal out to every listener
tokio-util = "0.7.19"
# config file format
toml = "1.1.6"
# OS randomness for the 256-bit API token
getrandom = "0.4.3"
# OS keychain that holds the API token
keyring = "4.2.0"
# daemon euid for the local-socket peer check, without hand-written unsafe
rustix = { version = "1.1.5", features = ["process"] }
# constant-time comparison of the API token
subtle = "2.6.1"
# service_fn connector for the gRPC client over a Unix socket in tests
tower = "0.5.3"
# local HTTP fixture server in the aulo-models tests
wiremock = "0.6.5"
# structured logs
tracing = "0.1.44"
# daily-rotating, non-blocking log files with a bounded file count
tracing-appender = "0.2.5"
# bridges tracing spans to OpenTelemetry, only built with the aulo-telemetry `otlp` feature
tracing-opentelemetry = "0.34.0"
# EnvFilter, JSON and human formatters for the log subscriber
tracing-subscriber = "0.3.23"
# full CLI command-output fixtures
trycmd = "1.2.1"
# host of a URL, so the normalizer speaks the site and not the whole address
url = "2.5.8"
# sortable ids for bots, chats, turns and calls
ulid = "3.0.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# Tests may unwrap; library and binary code returns errors instead.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
