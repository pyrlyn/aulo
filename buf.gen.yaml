version: v2
# Wipe docs/api first so a removed or renamed proto cannot leave a stale page behind.
clean: true
plugins:
  # Remote plugin pinned to the protoc-gen-doc release tag: the BSR serves a fixed build, so
  # CI and a laptop produce the same bytes and nothing has to be installed locally.
  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: docs/api
    # One page for the whole aulo.v1 package, so the reference is a single searchable file.
    opt: markdown,aulo.v1.md
