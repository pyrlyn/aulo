[package]
name = "aulo-speech"
description = "aulo speech engine contracts: STT, TTS, VAD, keyword spotting and end of turn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aulo-types = { path = "../aulo-types" }
thiserror = { workspace = true }

[features]
# Fake engines for tests in this and other crates; never on in a release build.
testkit = []

[dev-dependencies]
# Turns `testkit` on for this crate's own integration tests.
aulo-speech = { path = ".", features = ["testkit"] }

[lints]
workspace = true
