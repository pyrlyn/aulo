[package]
name = "aulo-config"
description = "Typed, layered aulo configuration with a JSON Schema and per-key provenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# validated engine choice for [voice.stt] and [voice.tts]
aulo-speech = { path = "../aulo-speech" }
# The log redaction rules, reused to mask `config show` output.
aulo-telemetry = { path = "../aulo-telemetry" }
figment = { workspace = true, features = ["toml", "env"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
# Jail serializes tests that touch process env and the working directory.
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
