[package]
name = "aulo-audio"
description = "aulo audio I/O: microphone capture as 16 kHz mono frames in a lock-free ring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aulo-speech = { path = "../aulo-speech" }
# Resampler: the streaming, allocation-free linear resampler the TTS path already uses.
aulo-speech-system = { path = "../aulo-speech-system" }
ringbuf = { workspace = true }
speech-capture = { workspace = true }
thiserror = { workspace = true }

[features]
# A scriptable fake input device for tests in this and other crates; never on in a release build.
testkit = []

[dev-dependencies]
# Turns `testkit` on for this crate's own integration tests.
aulo-audio = { path = ".", features = ["testkit"] }

[lints]
workspace = true
