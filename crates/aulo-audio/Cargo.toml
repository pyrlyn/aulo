[package]
name = "aulo-audio"
description = "aulo audio I/O: microphone capture as 16 kHz mono frames in a lock-free ring, optional Opus codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aulo-speech = { path = "../aulo-speech" }
# Resampler: the streaming, allocation-free linear resampler the TTS path already uses.
aulo-speech-system = { path = "../aulo-speech-system" }
# Only with the `opus` feature: it adds a C build (libopus), so it stays off by default.
opus = { workspace = true, optional = true }
aulo-types = { path = "../aulo-types" }
ringbuf = { workspace = true }
speech-capture = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# TCC state of the microphone via AVAudioApplication.recordPermission
objc2-avf-audio = { workspace = true, features = ["std", "AVAudioApplication"] }

[target.'cfg(windows)'.dependencies]
# Safe read of the microphone consent values in the registry
windows-registry = { workspace = true }

[features]
# Opus encoding and decoding of 20 ms frames for low-bandwidth remote clients (T6.7); PCM16 stays the default.
opus = ["dep:opus"]
# A scriptable fake input device for tests in this and other crates; never on in a release build.
testkit = []

[dev-dependencies]
# Turns `testkit` on for this crate's own integration tests.
aulo-audio = { path = ".", features = ["testkit"] }

[lints]
workspace = true
