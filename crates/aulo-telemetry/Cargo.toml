[package]
name = "aulo-telemetry"
description = "Rotating JSON logs, a human stderr log and optional OTLP traces, with secrets redacted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# OTLP trace export is opt-in so the default build carries no HTTP client.
otlp = ["telemetry-setup/otlp"]

[dependencies]
serde_json.workspace = true
telemetry-setup.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[lints]
workspace = true
