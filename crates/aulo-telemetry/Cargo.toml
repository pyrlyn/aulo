[package]
name = "aulo-telemetry"
description = "Rotating JSON logs, a human stderr log and optional OTLP traces, with secrets redacted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# OTLP trace export is opt-in so the default build carries no HTTP client.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { workspace = true, optional = true, features = ["trace"] }
regex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "registry", "std"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
