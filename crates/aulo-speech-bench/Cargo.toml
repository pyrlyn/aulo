[package]
name = "aulo-speech-bench"
description = "aulo speech benchmarks: word error rate, real-time factor and time to first audio per engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aulo-models = { path = "../aulo-models" }
aulo-speech = { path = "../aulo-speech" }
aulo-speech-cloud = { path = "../aulo-speech-cloud" }
aulo-speech-sherpa = { path = "../aulo-speech-sherpa" }
aulo-speech-system = { path = "../aulo-speech-system" }
aulo-speech-whisper = { path = "../aulo-speech-whisper" }
hound.workspace = true
serde_json.workspace = true
# The cloud engines upload on a runtime of their own; one worker is enough for one engine at a time.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AVSpeechSynthesizer delivers audio on the main run loop, which `with_main_run_loop` pumps.
objc2-foundation = { workspace = true, features = ["std", "NSDate", "NSRunLoop"] }

[features]
# Compiles whisper.cpp, so the `whisper-cpp` engine can run.
whisper = ["aulo-speech-whisper/whisper"]
# A scripted STT engine for tests and benchmarks; never on in a release build.
testkit = []

[dev-dependencies]
aulo-speech = { path = "../aulo-speech", features = ["testkit"] }
# Turns `testkit` on for this crate's own tests and benches.
aulo-speech-bench = { path = ".", features = ["testkit"] }
divan.workspace = true

[[bench]]
name = "speech"
harness = false

[lints]
workspace = true
