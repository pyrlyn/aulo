[package]
name = "aulo-voice"
description = "aulo voice domain: speech engine registry and switching, speakable-text normalizer and sentence splitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aulo-speech = { path = "../aulo-speech" }
aulo-types = { path = "../aulo-types" }
# Markdown is parsed without the HTML renderer: only the event stream is used.
pulldown-cmark = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# The pipeline runs as tokio tasks joined by bounded channels; the sync engine
# traits are driven from those tasks, never from an audio callback.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
# One cancellation token fans the shutdown out to every pipeline task.
tokio-util = { workspace = true }

[dev-dependencies]
aulo-speech = { path = "../aulo-speech", features = ["testkit"] }
insta = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util"] }

[lints]
workspace = true
