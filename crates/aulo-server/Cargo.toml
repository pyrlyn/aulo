[package]
name = "aulo-server"
description = "Assembles the aulod gRPC server: listeners, limits, health, reflection and graceful shutdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aulo-config = { path = "../aulo-config" }
aulo-proto = { path = "../aulo-proto" }
aulo-store = { path = "../aulo-store" }
aulo-types = { path = "../aulo-types" }
# `Provider` on the scripted test double (T3.7). Production turns stay a later task.
async-trait.workspace = true
getrandom.workspace = true
# Unix-socket (and Windows pipe) connector for the local gRPC client.
hyper-util = { workspace = true, features = ["tokio"] }
# Scenario parser for `aulod --scripted`. The feature is the test double, not a live model.
llm-wire = { workspace = true, features = ["test-util"] }
rcgen.workspace = true
keyring.workspace = true
rustls.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util.workspace = true
tonic = { workspace = true, features = ["tls-aws-lc"] }
tonic-health.workspace = true
tonic-reflection.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
aulo-telemetry = { path = "../aulo-telemetry" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-rustls.workspace = true
