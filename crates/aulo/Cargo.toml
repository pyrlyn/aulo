[package]
name = "aulo"
description = "aulo CLI and daemon entry points"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo run -p aulo -- <command>` runs the CLI, not the daemon.
default-run = "aulo"

[[bin]]
name = "aulo"
path = "src/main.rs"

[[bin]]
name = "aulod"
path = "src/bin/aulod.rs"

[dependencies]
anyhow.workspace = true
aulo-config = { path = "../aulo-config" }
aulo-server = { path = "../aulo-server" }
aulo-speech-bench = { path = "../aulo-speech-bench" }
aulo-telemetry = { path = "../aulo-telemetry" }
clap.workspace = true
# Builds the `--listen` override for the config loader and parses `cargo metadata` in the
# dependency-graph test.
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
trycmd.workspace = true

[lints]
workspace = true
