[package]
name = "aulo"
description = "aulo CLI and daemon entry points"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aulo"
path = "src/main.rs"

[[bin]]
name = "aulod"
path = "src/bin/aulod.rs"

[dependencies]
anyhow.workspace = true
aulo-config = { path = "../aulo-config" }
clap.workspace = true

[dev-dependencies]
# Full command-output fixtures in tests/cmd/.
trycmd.workspace = true
# Parses `cargo metadata` in the dependency-graph test.
serde_json.workspace = true

[lints]
workspace = true
