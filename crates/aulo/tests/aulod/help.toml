bin.name = "aulod"
args = "--help"
status.code = 0
stdout = """
The aulo daemon

Usage: aulod [OPTIONS] [COMMAND]

Commands:
  run   Run the daemon in the foreground (the default)
  help  Print this message or the help of the given subcommand(s)

Options:
      --config <DIR>   Directory holding config.toml (default: AULO_HOME)
      --listen <ADDR>  TCP address for remote clients; overrides daemon.listen
  -h, --help           Print help
  -V, --version        Print version
"""
