# Conventional Commits check of pull request commit subjects. The Kotlin/Native Gradle
# workspace (and its CI jobs) lands with plan S2; until then this workflow only lints
# commit subjects. The scans (CodeQL, Semgrep) live in pipeline.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A pull request's commit subjects follow the workspace rule: `<task id>: <title>` (T12.22: …)
  # when the commit belongs to a task, a Conventional Commit otherwise. Pushes to main skip this:
  # every commit there arrived through a pull request that passed it.
  commits:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the check ranges from the pull request's base branch to HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commit subjects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # An unresolvable base must be an error: rev-list would print nothing and the
          # check would pass itself.
          base="origin/$BASE_REF"
          git rev-parse -q --verify "$base^{commit}" > /dev/null \
            || { echo "base branch $base not found" >&2; exit 1; }
          # Merge commits are skipped (git writes their subjects), and so are reverts, which
          # git writes in its own format. Every offender is listed before the step fails.
          pattern='^(T[0-9]+(\.[0-9]+)*|(feat|fix|docs|ci|test|chore|style|refactor|perf|build)(\([a-z0-9._/-]+\))?!?): .+'
          bad=0
          for sha in $(git rev-list --no-merges --reverse "$base..HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              "Revert "*) continue ;;
            esac
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "neither '<task id>: <title>' nor a Conventional Commit: $sha $subject" >&2
              bad=1
            fi
          done
          exit $bad
