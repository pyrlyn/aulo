# Commit-subject lint and the Gradle Kotlin/Native build. Each target builds and tests on its own
# runner (cinterop with native libraries cannot be cross-built in general); linuxArm64 is
# cross-linked on Linux x86_64 and run on an arm64 runner. Job names `<os> (<target>)` are the
# checks to require on main. The scans (CodeQL, Semgrep) live in pipeline.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Shared Kotlin/Native libraries (kotlin-kit) and the build settings they need, from a checkout of
# pyrlyn/packages next to the repository (settings.gradle.kts reads these variables).
env:
  KOTLIN_KIT_DIR: ${{ github.workspace }}/packages/kotlin-kit
  SHARED_SETTINGS_DIR: ${{ github.workspace }}/packages/shared-settings

jobs:
  # A pull request's commit subjects must be Conventional Commits (workspace rule). Pushes to
  # main skip this: every commit there arrived through a pull request that passed it.
  commits:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the check ranges from the pull request's base branch to HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commit subjects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # An unresolvable base must be an error: rev-list would print nothing and the
          # check would pass itself.
          base="origin/$BASE_REF"
          git rev-parse -q --verify "$base^{commit}" > /dev/null \
            || { echo "base branch $base not found" >&2; exit 1; }
          # Merge commits are skipped (git writes their subjects), and so are reverts, which
          # git writes in its own format. Every offender is listed before the step fails.
          pattern='^(feat|fix|docs|ci|test|chore|style|refactor|perf|build)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          for sha in $(git rev-list --no-merges --reverse "$base..HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in
              "Revert "*) continue ;;
            esac
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "not a Conventional Commit: $sha $subject" >&2
              bad=1
            fi
          done
          exit $bad

  # Which runner the macOS job uses: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@9675ff42a0e3785beabccb68b0e4fa65910de453 # main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-15"]'

  # `docs-only` is "true" when every changed file is documentation (.github/infra.yml); it fails
  # open, so a failed `config` runs everything.
  config:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@9675ff42a0e3785beabccb68b0e4fa65910de453 # main

  build:
    name: ${{ matrix.os }} (${{ matrix.target }})
    needs: [config, macos-runner]
    # Draft PRs skip. A docs-only change still runs the job with every step a no-op, so the
    # required `<os> (<target>)` checks report instead of waiting.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Fork PRs keep the hosted macOS label; MACOS_CI_DISABLED moves the macOS job to Ubuntu as a no-op.
    runs-on: ${{ vars.MACOS_CI_DISABLED == 'true' && startsWith(matrix.os, 'macos') && 'ubuntu-24.04' || startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macosArm64
            task: MacosArm64
            ext: kexe
          - os: ubuntu-24.04
            target: linuxX64
            task: LinuxX64
            ext: kexe
          - os: windows-2025
            target: mingwX64
            task: MingwX64
            ext: exe
    defaults:
      run:
        shell: bash
    env:
      RUN: ${{ needs.config.outputs.docs-only != 'true' && !(vars.MACOS_CI_DISABLED == 'true' && startsWith(matrix.os, 'macos')) }}
      SKIP_TESTS: ${{ vars.SKIP_CI_TESTS == 'true' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a commit; bump it (and the tag in the comment) when aulo needs newer shared code.
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pyrlyn/packages
          ref: 52e941b40603391f6f74de0ff8958b24da42ecd0 # 0.0.5
          path: packages
          persist-credentials: false

      # Only the JDK: the lint and agent tools in mise.toml are not needed to build.
      - if: env.RUN == 'true'
        name: Install the JDK (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: java

      - if: env.RUN == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - if: env.RUN == 'true'
        name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # One Gradle invocation: each extra one re-resolves the build classpath, and Maven Central
      # answers GitHub's Linux runners with 429 often enough to fail a second pass.
      - if: env.RUN == 'true'
        name: Test, lint and link
        env:
          TASK: ${{ matrix.task }}
          TARGET: ${{ matrix.target }}
        run: |
          tasks=(":aulo:linkAuloReleaseExecutable$TASK" ":aulo:linkAulodReleaseExecutable$TASK")
          if [ "$SKIP_TESTS" = true ]; then
            echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"
          else
            tasks+=(test ktlintCheck)
          fi
          # linuxArm64 is cross-linked here and run by the linux-arm64 job.
          if [ "$TARGET" = linuxX64 ]; then
            tasks+=(:aulo:linkAuloReleaseExecutableLinuxArm64 :aulo:linkAulodReleaseExecutableLinuxArm64 :aulo:linkDebugTestLinuxArm64)
          fi
          ./gradlew "${tasks[@]}" --console=plain

      - if: env.RUN == 'true'
        name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          for exe in aulo aulod; do
            out=$("aulo/build/bin/$TARGET/${exe}ReleaseExecutable/$exe.$EXT" --version)
            echo "$out"
            printf '%s\n' "$out" | grep -q "^$exe " || { echo "$exe did not print its version" >&2; exit 1; }
          done
          out=$("aulo/build/bin/$TARGET/auloReleaseExecutable/aulo.$EXT" config show --origin)
          echo "$out"
          printf '%s\n' "$out" | grep -q '^policy.approval_timeout_secs = 60  # built-in defaults' || { echo "aulo config show failed" >&2; exit 1; }

      - if: env.RUN == 'true' && matrix.target == 'linuxX64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linuxArm64-binaries
          path: |
            aulo/build/bin/linuxArm64/auloReleaseExecutable/aulo.kexe
            aulo/build/bin/linuxArm64/aulodReleaseExecutable/aulod.kexe
            aulo/build/bin/linuxArm64/debugTest/test.kexe
          if-no-files-found: error
          retention-days: 3

      - if: env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aulo-${{ matrix.target }}
          path: |
            aulo/build/bin/${{ matrix.target }}/auloReleaseExecutable/aulo.${{ matrix.ext }}
            aulo/build/bin/${{ matrix.target }}/aulodReleaseExecutable/aulod.${{ matrix.ext }}
          if-no-files-found: error

  # Runs what the Linux x86_64 job cross-linked for linuxArm64: the tests and both executables.
  linux-arm64:
    name: ubuntu-24.04-arm (linuxArm64)
    needs: [config, build]
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      RUN: ${{ needs.config.outputs.docs-only != 'true' }}
      SKIP_TESTS: ${{ vars.SKIP_CI_TESTS == 'true' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linuxArm64-binaries
          path: bin

      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true'
        name: Tests
        run: |
          chmod +x bin/debugTest/test.kexe
          bin/debugTest/test.kexe

      - if: env.RUN == 'true'
        name: Smoke test
        run: |
          for exe in aulo aulod; do
            chmod +x "bin/${exe}ReleaseExecutable/$exe.kexe"
            out=$("bin/${exe}ReleaseExecutable/$exe.kexe" --version)
            echo "$out"
            printf '%s\n' "$out" | grep -q "^$exe " || { echo "$exe did not print its version" >&2; exit 1; }
          done
          out=$(bin/auloReleaseExecutable/aulo.kexe config show --origin)
          echo "$out"
          printf '%s\n' "$out" | grep -q '^policy.approval_timeout_secs = 60  # built-in defaults' || { echo "aulo config show failed" >&2; exit 1; }
