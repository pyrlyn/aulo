# Scans from pyrlyn-archive/ci-old's config-driven ci.yml (.github/infra.yml): CodeQL and Semgrep in
# parallel behind `pipeline / gate`, plus actionlint over the workflows. Rust CI is not
# repeated here: ci.yml runs it. Draft pull requests skip every job, the gate included, until
# marked ready. Secrets are passed explicitly (the disabled Snyk and SonarCloud checks still
# declare them).
# Shared workflows: https://github.com/pyrlyn-archive/ci-old/blob/main/docs/reusable-workflows.md
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pipeline:
    uses: pyrlyn-archive/ci-old/.github/workflows/ci.yml@9675ff42a0e3785beabccb68b0e4fa65910de453 # main 2026-10-27
    # The union every nested job asks for, validated up front even for disabled checks.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: write
      issues: write # pyrlyn-archive/ci-old main-failure job
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
