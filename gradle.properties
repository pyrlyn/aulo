# The single source of the aulo version; :aulo bakes it into BuildInfo.kt.
version=0.1.0-dev
# spec.md §17 D1. A build that contains sherpa-onnx TTS is GPL-3.0-or-later only (D9).
aulo.license=GPL-3.0-or-later OR LicenseRef-aulo-Royalty-Free

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
# A Linux or Windows host cannot build macosArm64; skip it there instead of failing the build.
kotlin.native.ignoreDisabledTargets=true
