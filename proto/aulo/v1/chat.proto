syntax = "proto3";

package aulo.v1;

import "aulo/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Chat CRUD and message history. Scopes: reads need `read`; create, rename and
// delete need `chat`.
service ChatService {
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  // Newest activity first (updated_at descending).
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc GetChat(GetChatRequest) returns (GetChatResponse);
  rpc RenameChat(RenameChatRequest) returns (RenameChatResponse);
  // Deletes the chat with its messages, tool calls and usage rows. Permanent.
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  // Oldest first (message id ascending).
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // Full-text search across all chats, best match first.
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
}

message Chat {
  string id = 1; // ULID.
  // The bot (agent persona) the chat belongs to; absent for the default bot.
  optional string bot_id = 2;
  // Untrusted when generated by the model. At most 200 bytes.
  string title = 3;
  // The model the next turn uses; changed by a SwitchModel submission.
  ModelRef model = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
  MESSAGE_ROLE_TOOL = 3;
}

message ToolCall {
  string id = 1; // ULID.
  // Untrusted; see Event ApprovalRequired.tool.
  string name = 2;
  // Model-chosen arguments as a JSON object. Untrusted.
  string arguments_json = 3;
  // Tool output, absent while running. Untrusted; the server caps it at 64 KiB
  // here and keeps the full text only in storage.
  optional string output = 4;
  ToolCallStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Message {
  string id = 1; // ULID.
  string chat_id = 2; // ULID.
  MessageRole role = 3;
  // Untrusted for every role except what the signed-in user typed. Text is
  // never interpreted as markup by the server.
  string content = 4;
  // Calls the assistant made in this message, oldest first.
  repeated ToolCall tool_calls = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateChatRequest {
  // Defaults to the default bot.
  optional string bot_id = 1;
  // Defaults to an empty title that the cheap tier fills in after the first turn.
  // At most 200 bytes.
  optional string title = 2;
  // Defaults to the bot's configured main model.
  optional ModelRef model = 3;
}

message CreateChatResponse {
  Chat chat = 1;
}

message ListChatsRequest {
  uint32 page_size = 1;
  string page_token = 2;
  // Only chats of this bot.
  optional string bot_id = 3;
}

message ListChatsResponse {
  repeated Chat chats = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetChatRequest {
  string chat_id = 1; // ULID.
}

message GetChatResponse {
  Chat chat = 1;
}

message RenameChatRequest {
  string chat_id = 1; // ULID.
  // Non-empty, at most 200 bytes.
  string title = 2;
}

message RenameChatResponse {
  Chat chat = 1;
}

message DeleteChatRequest {
  string chat_id = 1; // ULID.
}

message DeleteChatResponse {}

message ListMessagesRequest {
  string chat_id = 1; // ULID.
  uint32 page_size = 2;
  string page_token = 3;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  string next_page_token = 2;
}

message SearchMessagesRequest {
  // Untrusted user input for the FTS index; at most 1 KiB. Treated as plain
  // words, never as query syntax.
  string query = 1;
  uint32 page_size = 2;
  string page_token = 3;
  // Only this chat.
  optional string chat_id = 4;
}

message SearchMessagesResponse {
  repeated Message messages = 1;
  string next_page_token = 2;
}
